name: Auto Release

on:
  pull_request:
    types: [closed]
    branches:
      # this will limit the github actions a bit.
      - main

# Releases bump the version on main, so they must never run in parallel.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions: {}

jobs:
  auto-release:
    name: auto release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the version commit and tag (with the GitHub App token)
    environment:
      name: huginn
      deployment: false
    if: >-
      github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'update-github-languages' &&
        github.repository == 'luxass/github-languages-rs' &&
        (github.event.pull_request.user.login == 'luxass' || github.event.pull_request.user.login == 'huginn-watch[bot]')
    steps:
      - name: require complete PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [[ "${PR_TITLE,,}" == *"[incomplete]"* || "$PR_BODY" == *"<!-- pr-metadata:incomplete -->"* ]]; then
            echo "::error::This update is incomplete. Correct the PR title and summary and remove the incomplete markers before merging."
            exit 1
          fi

      - name: generate token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          repositories: luxass/github-languages-rs
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - run: rustup default stable

      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: just,cargo-edit

      - name: create tag and release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          IFS='.' read -r MAJOR MINOR PATCH <<< "$(awk -F ' = ' '/^version = / {gsub(/"/, "", $2); print $2; exit}' Cargo.toml)"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          # Use the reviewed PR title, including any manual correction after an AI failure.
          if [[ "$PR_TITLE" =~ ^feat(\(.+\))?: ]]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          fi

          git config user.email "273299945+huginn-watch[bot]@users.noreply.github.com"
          git config user.name "huginn-watch[bot]"

          just release "$NEW_VERSION"
          git push && git push --tags
